# Workflows [no indentation required for naming the workflow]

name: Hello
# on tells when the workflow should run[Give indentation by tab]

on:
  workflow_dispatch: 
# Jobs 
# jobs tell what the workflow Should do ,there can be one or more than one jobs, hence we write jobs 
# job is an object so need a indentation 
jobs: 
  # 1st job (give indentation)
  say-hello:
    # Create an Ephermal Container woth Ubantu running 
    runs-on: ubuntu-latest  
    # That ephermal container will have steps to execute , hence name those steps and use run run has the command 
    steps:
      - name: Say hello to everyone 
        run: echo "Hello dosto"
# Steps
# Should be inside the jobs

# Actions
# Should be in side the Steps
