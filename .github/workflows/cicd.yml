name: CICD

on: 
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code "
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build using docker 
        run: echo "Building using Docker"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Running test Cases
        run: echo "testing the "      
  deploy:
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying on the machine
        run: echo "Deploying the code"
      
